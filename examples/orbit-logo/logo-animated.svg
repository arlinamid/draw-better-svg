<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-labelledby="logo-title">
  <!-- Derived: logo-themed.svg with motion.css embedded, so the animation plays where the SVG is shown as an image. -->
  <style>
/* Tokens document the choices; keyframe easings are written literally because
   Chromium drops var() used as animation-timing-function inside @keyframes. */
:root { --dbs-ease-draw: cubic-bezier(0.4, 0, 0.2, 1); --dbs-ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1); }
@media (prefers-reduced-motion: no-preference) {
  /* backwards fill: the motion-only properties (dash, clip) vanish at the end, so
     the last frame is exactly the delivered SVG. */
  #ring { animation: dbs-draw 900ms cubic-bezier(0.4, 0, 0.2, 1) 100ms backwards; }
  #dot { transform-box: fill-box; transform-origin: center; animation: dbs-pop 500ms cubic-bezier(0.34, 1.56, 0.64, 1) 750ms backwards; }
  #wordmark { animation: dbs-wipe 600ms cubic-bezier(0.16, 1, 0.3, 1) 950ms backwards; }
}
@keyframes dbs-draw { from { stroke-dasharray: 1 2; stroke-dashoffset: 1; } to { stroke-dasharray: 1 2; stroke-dashoffset: 0; } }
@keyframes dbs-pop { from { transform: scale(0); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } to { transform: scale(1); opacity: 1; } }
@keyframes dbs-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  </style>
  <style>@media (prefers-color-scheme: dark) { #wordmark { fill: #f4f1ea; } #ring { stroke: #5fa8ad; } }</style>
  <title id="logo-title">Orbit logo</title>
  <g id="mark">
    <circle id="ring" cx="60" cy="60" r="38" fill="none" stroke="#2f6f73" stroke-width="10" pathLength="1"/>
    <circle id="dot" cx="87" cy="33" r="11" fill="#e8743b"/>
  </g>
  <text id="wordmark" x="118" y="74" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#1f2a30">Orbit</text>
</svg>
